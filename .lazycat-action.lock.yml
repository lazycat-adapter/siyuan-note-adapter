    changelog: |-
        Upstream 3.8.11
        ## Upgrade notice

        ### Database formats

        - **Primary-key rich text (formats 15 and 16).** Inline rich text saved in format 15 by earlier preview builds remains readable. Saving new block rich text in a primary key, including text with images, upgrades the database to at least format 16. [Primary-key compatibility](https://github.com/siyuan-note/siyuan/issues/21136)
        - **Inline images in ordinary text fields (format 17).** Saving the first inline image in an ordinary text field upgrades that database to format 17. [Text field compatibility](https://github.com/siyuan-note/siyuan/issues/21527)

        Simply opening a database does not trigger these upgrades. Version 3.8.10 supports database formats up to 14. A client can only open databases in formats it supports. Update every device that syncs or accesses the same data before using the new formats. Back up your workspace beforehand. To roll back, restore a complete pre-upgrade snapshot.

        ### Other compatibility changes

        - **AI long-term memory.** Restoring a workspace snapshot now rolls back both memory records and their revocation state. Restoring a snapshot from before a memory was forgotten can make it available again if it still passes the usual validity checks. [Long-term memory](https://github.com/siyuan-note/siyuan/blob/64fe75eb55fc783a345ea00fb4db8b60268dd65c/docs/LONG-TERM-MEMORY.md)
        - **Kernel API.** JSON requests handled by API contracts have a 32 MiB body limit, with a 64 KiB limit for `loginAuth`. Requests exceeding these limits return code `-1`. [API contracts](https://github.com/siyuan-note/siyuan/blob/64fe75eb55fc783a345ea00fb4db8b60268dd65c/docs/API-CONTRACTS.md)

        ## Overview

        This release adds rich text and block editing in database primary keys, a built-in date picker, unified color editing, and plugin snapshot browsing and restoration.

        Mind maps support custom node and connector styles and freeform connections between nodes. The standalone Markdown editor adds find and replace, while macOS gains offline Markdown Quick Look previews.

        Watch the release overview: [YouTube](https://youtu.be/PLbCKqtZw_M)

        ## Changelogs

        Below are the detailed changes in this version.

        ### Enhancement

        * [Support a built-in date picker and improve date and time editing](https://github.com/siyuan-note/siyuan/issues/21127)
        * [Support unified color editing with HEX, RGB, and a native picker](https://github.com/siyuan-note/siyuan/issues/21134)
        * [Support rich text and block editing in database primary keys](https://github.com/siyuan-note/siyuan/issues/21136)
        * [Support offline Markdown Quick Look previews on macOS](https://github.com/siyuan-note/siyuan/issues/21139)
        * [Support choosing whether to restore document reading positions](https://github.com/siyuan-note/siyuan/issues/21320)
        * [Support browsing and restoring plugin snapshots](https://github.com/siyuan-note/siyuan/issues/21350)
        * [Improve kernel process icon display on Linux](https://github.com/siyuan-note/siyuan/issues/21364)
        * [Support separate entry icon controls for database primary keys and relation/rollup fields](https://github.com/siyuan-note/siyuan/issues/21366)
        * [Support KDE system proxy detection on Linux](https://github.com/siyuan-note/siyuan/pull/21367)
        * [Support per-node connector styles and shapes in mind maps](https://github.com/siyuan-note/siyuan/issues/21368)
        * [Reduce document tree indentation to improve readability](https://github.com/siyuan-note/siyuan/issues/21381)
        * [Support freeform mind map relationships with configurable paths and line patterns](https://github.com/siyuan-note/siyuan/issues/21384)
        * [Support ignore rules for unused asset cleanup](https://github.com/siyuan-note/siyuan/issues/21398)
        * [Preserve document context when following references to visible blocks](https://github.com/siyuan-note/siyuan/issues/21400)
        * [Improve mobile bottom sheet dragging](https://github.com/siyuan-note/siyuan/issues/21403)
        * [Support find and replace in the standalone Markdown editor](https://github.com/siyuan-note/siyuan/issues/21417)
        * [Support expanding or collapsing grouped search results by default](https://github.com/siyuan-note/siyuan/issues/21446)

        ### Bugfix

        * [Automatic block collection continues after the database block is deleted](https://github.com/siyuan-note/siyuan/issues/21361)
        * [Embedded local HTML attachments open in an external browser on iOS](https://github.com/siyuan-note/siyuan/issues/21389)

        ## Download

        * [B3log](https://b3log.org/siyuan/en/download.html)
        * [GitHub](https://github.com/siyuan-note/siyuan/releases)
