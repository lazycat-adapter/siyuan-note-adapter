application:
    package: cloud.lazycat.app.siyuan
    version: 3.8.12
    lpk_sha256: 404dd5aedbbce04c04f63d86765d1e86e1d05dee193c171e0fc39bf79993704a
    changelog: |-
        Upstream 3.8.12
        ## Upgrade notice

        Plugins that rely on the desktop main menu’s previous identifier, `barWorkspace`, should use `barMainMenu` for the button ID and menu events. [Details](https://github.com/siyuan-note/siyuan/issues/21544)

        ## Overview

        This release adds manual ordering for sibling tags and sorting by most recent addition in the tag panel. Mobile image preview gestures and controls are improved, and asset files can now be shared from mobile.

        The desktop Markdown editor supports relative document links, and database cell editors are better aligned. This release also adds a Vietnamese interface and a built-in Russian user guide, and introduces the official SiYuan connector for WorkBuddy.

        Watch the release overview: [YouTube](https://youtu.be/aiTfeTa8Tlk)

        ## Changelogs

        Below are the detailed changes in this version.

        ### Enhancement

        * [Support manual sorting of sibling tags in the tag panel](https://github.com/siyuan-note/siyuan/issues/21508)
        * [Support sorting the tag panel by most recent addition](https://github.com/siyuan-note/siyuan/issues/21509)
        * [Improve sync reliability when putFile writes overlap snapshot indexing](https://github.com/siyuan-note/siyuan/issues/21510)
        * [Support relative document links in the desktop Markdown editor](https://github.com/siyuan-note/siyuan/issues/21542)
        * [Improve database cell editor alignment](https://github.com/siyuan-note/siyuan/issues/21546)
        * [Support Vietnamese interface language](https://github.com/siyuan-note/siyuan/issues/21548)
        * [Support in-process OCR in dynamically linked Linux builds](https://github.com/siyuan-note/siyuan/issues/21555)
        * [Improve mobile image preview gestures and controls](https://github.com/siyuan-note/siyuan/issues/21557)
        * [Add official SiYuan connector for WorkBuddy](https://github.com/siyuan-note/siyuan/issues/21574)
        * [Support sharing asset files on mobile](https://github.com/siyuan-note/siyuan/issues/21590)
        * [Support AI provenance in block attributes](https://github.com/siyuan-note/siyuan/issues/21630)

        ### Bugfix

        * [SiYuan may exit during startup on iOS](https://github.com/siyuan-note/siyuan/issues/21556)

        ### Document

        * [Add a built-in Russian user guide](https://github.com/siyuan-note/siyuan/pull/21585)

        ### Refactor

        * [Upgrade to Electron v44.11.5](https://github.com/siyuan-note/siyuan/issues/21607)

        ### Development

        * [Improve naming consistency for the desktop main menu](https://github.com/siyuan-note/siyuan/issues/21544)

        ## Download

        * [B3log](https://b3log.org/siyuan/en/download.html)
        * [GitHub](https://github.com/siyuan-note/siyuan/releases)
