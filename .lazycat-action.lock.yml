    changelog: |-
        Upstream 3.8.10
        ## Overview

        This release adds rich document titles, database sub-items and related views, workspace-level AI long-term memory, and a built-in lightweight Markdown editor.

        Document trees handle large directories more efficiently, while unified document and block breadcrumbs make navigation more consistent. Other improvements include mobile bottom sheets, HTTP requests in templates, custom PDF page sizes, LAN sync address selection, and bazaar compatibility filtering.

        ## Changelogs

        Below are the detailed changes in this version.

        ### Enhancement

        * [Support unified document and block breadcrumbs](https://github.com/siyuan-note/siyuan/issues/3007)
        * [Support rich document titles and preserve slashes in notebook names](https://github.com/siyuan-note/siyuan/issues/20837)
        * [Improve document tree browsing performance and access to large directories](https://github.com/siyuan-note/siyuan/issues/20884)
        * [Support breadcrumb button visibility and ordering in appearance profiles](https://github.com/siyuan-note/siyuan/issues/20916)
        * [Support converting embed blocks to regular blocks or block references](https://github.com/siyuan-note/siyuan/issues/21018)
        * [Support configuring an Exa API key for built-in web search](https://github.com/siyuan-note/siyuan/issues/21026)
        * [Support database sub-items](https://github.com/siyuan-note/siyuan/issues/21038)
        * [Support HTTP requests in templates](https://github.com/siyuan-note/siyuan/issues/21058)
        * [Support workspace-level long-term memory for AI](https://github.com/siyuan-note/siyuan/issues/21062)
        * [Improve mind map summary input sizing, alignment, and colors](https://github.com/siyuan-note/siyuan/issues/21063)
        * [Improve Android edge-to-edge navigation bar adaptation](https://github.com/siyuan-note/siyuan/issues/21067)
        * [Improve floating window resizing responsiveness](https://github.com/siyuan-note/siyuan/issues/21068)
        * [Improve keyword search for text containing apostrophes](https://github.com/siyuan-note/siyuan/issues/21071)
        * [Support custom PDF page sizes](https://github.com/siyuan-note/siyuan/issues/21087)
        * [Improve mobile undo and redo access through the More menu](https://github.com/siyuan-note/siyuan/issues/21095)
        * [Support configuring floating dock bar visibility](https://github.com/siyuan-note/siyuan/issues/21097)
        * [Support loop playback for video blocks](https://github.com/siyuan-note/siyuan/issues/21098)
        * [Support a built-in lightweight Markdown editor](https://github.com/siyuan-note/siyuan/issues/21115)
        * [Support disabling the fixed-port proxy with a command-line option](https://github.com/siyuan-note/siyuan/issues/21133)
        * [Improve multi-row table header creation](https://github.com/siyuan-note/siyuan/issues/21155)
        * [Improve mobile dialog consistency with bottom sheets](https://github.com/siyuan-note/siyuan/issues/21160)
        * [Improve tag deletion with optional removal of automatically collected database entries](https://github.com/siyuan-note/siyuan/issues/21169)
        * [Support related database views in entry details](https://github.com/siyuan-note/siyuan/issues/21172)
        * [Improve LAN sync address selection in multi-interface and VPN environments](https://github.com/siyuan-note/siyuan/issues/21174)
        * [Support bazaar package compatibility filtering and sorting by first release date](https://github.com/siyuan-note/siyuan/issues/21273)

        ### Refactor

        * [Migrate the desktop Electron main process to strict TypeScript modules](https://github.com/siyuan-note/siyuan/pull/21151)

        ### Development

        * [Support opening document and notebook menus via the plugin API](https://github.com/siyuan-note/siyuan/issues/21219)

